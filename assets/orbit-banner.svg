    <ellipse rx="92" ry="36" transform="rotate(-24)" fill="none" stroke="#E84142" stroke-width="3" stroke-dasharray="150 400" stroke-linecap="round"/>
    <circle r="34" fill="url(#planet)"/>
    <circle r="34" fill="none" stroke="#0B0E14" stroke-width="2"/>
    <circle cx="84" cy="-37" r="8" fill="#F5F7FA"/>
